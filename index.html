  <script>
    // ══════════════════════════════════════════

    const CACHE_KEY = 'ftu_event_hub_cache_v3';
    const TTL = 15 * 60 * 1000; // 15-minute cache

    // ══════════════════════════════════════════
    //   UUID → VISUAL LABELS DICTIONARIES
    // ══════════════════════════════════════════

      '3bb05abc-6500-4a8d-8966-95cf9f53c60f': 'Workshop',
      '0dcb82c6-ea73-482c-96f7-9051559039c1': 'Webinar',

    };

    const MUCDRL_MAP = {
      'a45df4dc-3e1d-4193-9ba4-f893d6cd3dc4': '3.1',
      '459fd61b-b6b9-4144-838b-553d69fef02d': '3.2',
      'f1a2b3c4-0003-0003-0003-000000000001': '1.1',
      'f1a2b3c4-0003-0003-0003-000000000002': '0',
    };

    const DRL_DESCS = {
      '1.1': 'Mục 1.1: Đánh giá ý thức học tập, nghiên cứu và bồi dưỡng rèn luyện môn học cấp trường.',
      '3.1': 'Mục 3.1: Tham gia các hoạt động Đoàn, Hội, Đội, CLB hữu ích nhằm rèn luyện phẩm chất.',
      '3.2': 'Mục 3.2: Hoạt động xã hội, nhân đạo, tình nguyện vì cộng đồng từ trung ương đến địa phương.',
      '0': 'Hoạt động nâng cao tư duy, giao lưu học thuật bổ ích và không cấp Điểm rèn luyện (ĐRL)'
    };

    const POP_SKILLS = [
      "Thương mại quốc tế", "Tài chính - Kế kiểm", "Marketing", "Phân tích dữ liệu", "Giao tiếp liên văn hóa",
      "Giải quyết vấn đề", "Tư duy phản biện", "Tư duy sáng tạo",
      "Nghiên cứu khoa học", "Phát triển dự án", "Kỹ năng giao tiếp", "Làm việc nhóm",
      "Định hướng nghề nghiệp", "Networking", "Ứng dụng AI thực tế"
    ];

    // Helper functions for parsing
    function mapField(val, mapping) {
      if (!val) return '';
      const t = val.trim();
      const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      if (UUID_RE.test(t)) return mapping[t] || val;
      return val;
    }

    function convertDriveLink(url) {
      if (!url) return '';
      const match = url.match(/\/d\/(.*?)(\/|$)/);
      if (match && match[1] && url.includes('drive.google.com')) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      return url;
    }

    function removeAccents(str) {
      if (!str) return '';
      return str
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D')
        .toLowerCase();
    }

    function formatVNDate(str) {
      if (!str) return 'Chưa có';
      const d = new Date(str);
      return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
    }

    function getDaysLeft(str) {
      if (!str) return -999;
      const today = new Date(); today.setHours(0,0,0,0);
      const target = new Date(str); target.setHours(0,0,0,0);
      return Math.round((target.getTime() - today.getTime()) / 86400000);
    }

    // ══════════════════════════════════════════

    // ══════════════════════════════════════════

      activeTab: 'home',

      selectedSkills: [],
      selectedDrls: [],
      sortMode: 'date',

      selectedReviewId: null,

      calYear: new Date().getFullYear(),
      calMonth: new Date().getMonth(),
      selectedCalDay: new Date().getDate(),
      
      // Search
      searchQuery: '',
      
      // UI modals

      showRefreshToast: false,

    // Advanced local cache parser
    function parseData(eventsRaw, reviewsRaw) {
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      const parsedEvents = eventsRaw.map(e => {
        let mappedType = mapField(e.type, TYPE_MAP);
        let mappedMode = mapField(e.mode, MODE_MAP);
        let mappedMuc = mapField(e.mucDRL, MUCDRL_MAP);
        if (!mappedMuc || mappedMuc === '') mappedMuc = '0';

        let poster = e.POSTER ? convertDriveLink(e.POSTER) : '';

        let status = 'open';
        if (e.date < todayStr) status = 'ended';
        else if (e.deadline < todayStr) status = 'closed';

        // safely map skills
        let skillsList = [];
        if (Array.isArray(e.skills)) skillsList = e.skills;
        else if (typeof e.skills === 'string') {
          try {
            if (e.skills.startsWith('[') && e.skills.endsWith(']')) {
              skillsList = JSON.parse(e.skills);
            } else {
              skillsList = e.skills.split(',').map(s => s.trim()).filter(Boolean);
            }
          } catch {
            skillsList = e.skills.split(',').map(s => s.trim()).filter(Boolean);
          }
        }

        return {
          id: Number(e.id),
          name: e.name || 'Sự kiện không tên',
          type: mappedType,
          mode: mappedMode,
          date: e.date,
          time: e.time || 'Cả ngày',
          club: e.club || 'Ban hoạt động',
          location: e.location,
          deadline: e.deadline,
          link: e.link,
          POSTER: poster,
          desc: e.desc,
          emoji: e.emoji || '🎓',
          color: e.color || '#fdf0f2',
          diemDRL: Number(e.diemDRL || 0),
          mucDRL: mappedMuc,
          skills: skillsList,
          rating: Number(e.rating || 0),
          reviewCount: Number(e.reviewCount || 0),
          status
        };
      });

      const parsedReviews = reviewsRaw.map(r => {
        const getValArray = (val) => {
          if (Array.isArray(val)) return val;
          if (typeof val === 'string') {
            try {
              if (val.startsWith('[') && val.endsWith(']')) return JSON.parse(val);
              return val.split(',').map(s => s.trim()).filter(Boolean);
            } catch {
              return val.split(',').map(s => s.trim()).filter(Boolean);
            }
          }
          return [];
        };

        return {
          id: Number(r.id),
          eventId: Number(r.eventId),
          user: r.user || 'Ẩn danh',
          orgStars: Number(r.orgStars || 5),
          takeaway: r.takeaway || '',
          tagsPos: getValArray(r.tagsPos),
          tagsNeg: getValArray(r.tagsNeg)
        };
      });

      return { events: parsedEvents, reviews: parsedReviews };
    }

    const stateHandler = {
      set(target, property, value) {
        target[property] = value;
        // Trigger smart DOM updates depending on what changed
        if (['events', 'reviews', 'loading', 'activeTab', 'selectedHomeType', 'selectedExploreType', 'selectedSkills', 'selectedDrls', 'sortMode', 'currentDrlMuc', 'selectedReviewId', 'searchQuery', 'calYear', 'calMonth', 'selectedCalDay', 'error'].includes(property)) {
          renderApp();
        }
        if (property === 'activeTab' && typeof syncNavButtons === 'function') {
          syncNavButtons(value);
        }
        if (property === 'selectedEventId') {
          renderModal();
        }
        if (property === 'showRefreshToast') {
          toggleToast();
        }
        return true;
      }
    };

    const state = new Proxy(rawState, stateHandler);
    window.state = state;

    // ══════════════════════════════════════════
    //   FUZZY SEARCH ALGORITHM
    // ══════════════════════════════════════════
    function fuzzyMatch(event, query) {
      if (!query) return true;
      const q = removeAccents(query).trim();
      if (!q) return true;
      const tokens = q.split(/\s+/);
      const searchTarget = removeAccents(`${event.name} ${event.club} ${event.type} ${event.desc || ''} ${event.skills.join(' ')}`);
      return tokens.every(t => searchTarget.includes(t));
    }

    // Debounce decorator
    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    // ══════════════════════════════════════════
    //   DATA REST & CACHING PIPELINE
    // ══════════════════════════════════════════
    async function loadResources(isForce = false) {
      // Try local cache
      const rawCache = localStorage.getItem(CACHE_KEY);
      let cacheAgeValid = false;

      if (rawCache && !isForce) {
        try {
          const cache = JSON.parse(rawCache);
          const age = Date.now() - cache.timestamp;
          if (age < TTL) {
            state.events = cache.events;
            state.reviews = cache.reviews;
            state.loading = false;
            cacheAgeValid = true;
          }
        } catch (e) {
          console.warn('Discarding malformed cache.');
        }
      }

      if (!cacheAgeValid) {
        state.loading = true;
      }

      try {
        const [evRes, rvRes] = await Promise.all([
          fetch(`${API_URL}?action=getEvents&t=${Date.now()}`),
          fetch(`${API_URL}?action=getReviews&t=${Date.now()}`)
        ]);

        if (!evRes.ok || !rvRes.ok) throw new Error();

        const rawEvents = await evRes.json();
        const rawReviews = await rvRes.json();
        const fresh = parseData(rawEvents, rawReviews);

        if (cacheAgeValid) {
          // Compare with current states
          const currentEIds = state.events.map(e => `${e.id}-${e.status}-${e.rating}`).join(',');
          const freshEIds = fresh.events.map(e => `${e.id}-${e.status}-${e.rating}`).join(',');

          if (currentEIds !== freshEIds || state.reviews.length !== fresh.reviews.length) {
            state.pendingSyncData = fresh;
            state.showRefreshToast = true;
          }
        } else {
          state.events = fresh.events;
          state.reviews = fresh.reviews;
          state.loading = false;
          
          localStorage.setItem(CACHE_KEY, JSON.stringify({
            timestamp: Date.now(),
            events: fresh.events,
            reviews: fresh.reviews
          }));
        }
        state.error = null;
      } catch (err) {
        console.error('Fetch error:', err);
        if (!cacheAgeValid) {
          state.error = "Không thể liên kết máy chủ. Vui lòng kiểm tra lại kết nối mạng của bạn.";
          state.loading = false;
        }
      }
    }

              <div class="flex gap-1.5 overflow-x-auto scrollbar-none">

                    <button onclick="toggleFilterArray('selectedDrls', '${o}')" class="px-3.5 py-1.5 rounded-xl text-[10px] font-bold border whitespace-nowrap cursor-pointer transition-all ${
                      active
                        ? 'bg-brand-red-light text-brand-red border-brand-red-mid font-black'

          <!-- Total Count bar -->

              <span>Xếp:</span>

                <option value="date" ${state.sortMode==='date'?'selected':''}>Sắp tới</option>
                <option value="rating" ${state.sortMode==='rating'?'selected':''}>Sao cao nhất</option>
                <option value="drl" ${state.sortMode==='drl'?'selected':''}>ĐRL nhiều</option>
              </select>
            </div>
          </div>

          <!-- Rows Containers listing -->
          <div class="px-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${sorted.length === 0 ? `
              <div class="col-span-full text-center py-16 bg-white/40 dark:bg-slate-900/10 border border-slate-200/40 dark:border-slate-800 rounded-3xl p-6 text-slate-400 text-xs">
                Không có sự kiện nào khớp với tiêu chuẩn của bạn.
              </div>
            ` : sorted.map(e => `
              <div onclick="state.selectedEventId=${e.id}" class="bg-white/50 dark:bg-slate-900/50 border border-slate-200/40 dark:border-slate-800/80 rounded-2xl p-4 soft-shadow hover:border-brand-red-mid transition-all duration-200 cursor-pointer space-y-3 group flex flex-col justify-between h-full">
                <div class="space-y-3">
                  <div class="flex justify-between items-start gap-4">
                    <h3 class="text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100 leading-snug group-hover:text-brand-red transition-all">
                      ${e.emoji} ${e.name}
                    </h3>
                    ${e.mucDRL && e.mucDRL !== '0' ? `
                      <span class="text-[9px] font-extrabold bg-blue-50 dark:bg-blue-999/10 text-blue-700 dark:text-blue-400 px-2 py-0.5 rounded-full flex-shrink-0">
                        Mục ${e.mucDRL} (+${e.diemDRL}đ)
                      </span>
                    ` : ''}
                  </div>

                  <div class="text-[10px] text-slate-400 font-bold space-y-1 sm:space-y-0 sm:flex sm:items-center sm:gap-3 leading-none">
                    <span>${formatVNDate(e.date)} · ${e.time}</span>
                    <span class="hidden sm:inline">|</span>
                    <span class="truncate max-w-[120px] inline-block"><i data-lucide="landmark" class="w-3 h-3 inline mr-0.5"></i> ${e.club}</span>
                    <span class="hidden sm:inline">|</span>
                    <span><i data-lucide="map-pin" class="w-3 h-3 inline mr-0.5"></i> ${e.location || (e.mode === 'Online' ? 'Online' : 'TBA')}</span>

                <div class="flex justify-between items-center gap-2 pt-2 border-t border-slate-100/40 mt-auto">

      const inp = document.getElementById('search-input-field');
      inp.addEventListener('input', debounce((ev) => {
        state.searchQuery = ev.target.value;
      }, 300));
      
      // Select cursor maintain
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);

      document.getElementById('sort-select').addEventListener('change', (ev) => {
        state.sortMode = ev.target.value;
      });

    // Toggle filter list
    window.toggleFilterArray = function(key, val) {
      const idx = state[key].indexOf(val);
      if (idx > -1) {
        state[key] = state[key].filter(i => i !== val);
      } else {
        state[key] = [...state[key], val];
      }
    };

    // ── TRANG LỊCH THÁNG ──
    function renderCalendar() {
      const first = new Date(state.calYear, state.calMonth, 1);
      let startOfW = first.getDay();
      startOfW = startOfW === 0 ? 6 : startOfW - 1;

      const totalDays = new Date(state.calYear, state.calMonth + 1, 0).getDate();
      const totalPrevDays = new Date(state.calYear, state.calMonth, 0).getDate();

      // Event mapper for day dots
      const mEvents = {};
      state.events.forEach(e => {
        const d = new Date(e.date);
        if (d.getFullYear() === state.calYear && d.getMonth() === state.calMonth) {
          const day = d.getDate();
          if (!mEvents[day]) mEvents[day] = [];
          mEvents[day].push(e);
        }
      });

      const today = new Date();
      const selectEvs = mEvents[state.selectedCalDay] || [];

      viewport.innerHTML = `
        <div class="space-y-4 pb-4">
          <div class="bg-white/40 dark:bg-slate-900/30 px-4 pt-5 pb-3 border-b border-slate-200/50 dark:border-slate-800/80 sticky top-0 z-20 glass-nav shadow-xs flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-slate-900 dark:text-slate-50 flex items-center gap-1.5">
              📅 Lịch sự kiện
            </h1>

            <div class="flex items-center bg-slate-100/80 dark:bg-slate-800/80 border border-slate-200/50 dark:border-white/5 rounded-xl p-1 gap-2">
              <button onclick="shiftMonth(-1)" class="p-1 text-slate-500 hover:text-slate-800 rounded-lg cursor-pointer active:scale-90"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
              <span class="text-[10px] font-black text-slate-700 dark:text-slate-200 uppercase tracking-widest min-w-[90px] text-center">
                T${state.calMonth+1} / ${state.calYear}
              </span>
              <button onclick="shiftMonth(1)" class="p-1 text-slate-500 hover:text-slate-800 rounded-lg cursor-pointer active:scale-90"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
            </div>
          </div>

          <!-- Calendar core element wrapper -->
          <div class="px-4">
            <div class="bg-white/40 dark:bg-slate-950/20 rounded-3xl p-4 border border-slate-200/30 dark:border-slate-800 soft-shadow">
              
              <div class="grid grid-cols-7 gap-1.5 mb-3">
                ${['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(d => `
                  <span class="text-center text-[9px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-wider select-none">${d}</span>
                `).join('')}
              </div>

              <div class="grid grid-cols-7 gap-1.5">
                <!-- spaces prev -->
                ${[...Array(startOfW)].map((_, idx) => {
                  const dNum = totalPrevDays - startOfW + idx + 1;
                  return `<div class="aspect-square flex items-center justify-center text-[10px] font-bold text-slate-350 dark:text-slate-700 select-none">${dNum}</div>`;
                }).join('')}

                <!-- active days -->
                ${[...Array(totalDays)].map((_, idx) => {
                  const dNum = idx + 1;
                  const has = !!mEvents[dNum];
                  const sel = state.selectedCalDay === dNum;
                  const isT = today.getDate() === dNum && today.getMonth() === state.calMonth && today.getFullYear() === state.calYear;

                  let cls = "aspect-square rounded-xl flex flex-col items-center justify-center relative cursor-pointer select-none ring-offset-slate-50 ";
                  
                  if (sel && isT) cls += "bg-brand-red text-white shadow font-black scale-105";
                  else if (sel) cls += "bg-brand-red-light text-brand-red-dark dark:text-rose-400 border border-brand-red-mid/50 font-black scale-105 z-10";
                  else if (isT) cls += "bg-slate-800 text-white dark:bg-white dark:text-slate-950 font-black";
                  else if (has) cls += "bg-slate-100/50 dark:bg-slate-800/30 hover:bg-slate-100 text-slate-700 dark:text-slate-200 font-bold border border-rose-100 dark:border-rose-950/20";
                  else cls += "text-slate-500 dark:text-slate-400 hover:bg-slate-50 hover:text-slate-800 font-medium";

                  return `
                    <div onclick="selectCalDay(${dNum})" class="${cls}">
                      <span class="text-[11px]">${dNum}</span>
                      ${has ? `<span class="w-1 h-1 rounded-full absolute bottom-1.5 ${sel || isT ? 'bg-white' : 'bg-brand-red'}" />` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Legend labels -->
            <div class="flex gap-4 px-2 mt-3 text-[9px] font-black text-slate-400 uppercase tracking-widest leading-none">
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded bg-slate-100 border border-rose-100 dark:bg-slate-800/40"></span>Có HĐ</span>
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded bg-slate-800 dark:bg-white"></span>Hôm nay</span>
            </div>
          </div>

          <!-- Bottom detailed day events lists -->
          <div class="px-4 space-y-3">
            <h3 class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest pt-2 border-t border-slate-200/30">
              Chi tiết ngày ${state.selectedCalDay} Tháng ${state.calMonth+1}, ${state.calYear}
            </h3>

            ${selectEvs.length === 0 ? `
              <div class="text-center py-8 text-xs text-slate-400">Không có hoạt động đặc thù nào trong ngày này.</div>
            ` : selectEvs.map(e => `
              <div onclick="state.selectedEventId=${e.id}" class="bg-white/50 dark:bg-slate-900/50 border border-slate-200/40 dark:border-slate-800 rounded-2xl p-4 soft-shadow hover:border-brand-red-mid transition-all duration-200 cursor-pointer space-y-2 group">
                <div class="flex justify-between items-start gap-3">
                  <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100 group-hover:text-brand-red leading-snug">
                    ${e.emoji} ${e.name}
                  </h4>
                  ${e.mucDRL && e.mucDRL !== '0' ? `
                    <span class="text-[8px] font-bold bg-blue-50 dark:bg-blue-950/20 text-blue-700 dark:text-blue-400 px-1.5 py-0.5 rounded">${e.mucDRL} (+${e.diemDRL}đ)</span>
                  ` : ''}
                </div>
                <div class="text-[10px] font-medium text-slate-400 flex items-center gap-2">
                  <span>${e.time}</span>
                  <span>|</span>
                  <span><i data-lucide="landmark" class="w-3 h-3 inline"></i> ${e.club}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    window.shiftMonth = function(dir) {
      let m = state.calMonth + dir;
      let y = state.calYear;
      if (m > 11) { m = 0; y++; }
      else if (m < 0) { m = 11; y--; }
      state.calMonth = m;
      state.calYear = y;
      state.selectedCalDay = 1;
    };

    window.selectCalDay = function(d) {
      state.selectedCalDay = d;
    };

    // ── TRANG TRI THỨC / REVIEW ──
    function renderReview() {
      // Calculate club reputations
      const repsMap = {};
      state.reviews.forEach(r => {
        const e = state.events.find(ev => ev.id === r.eventId);
        if (!e) return;
        if (!repsMap[e.club]) repsMap[e.club] = { stars: [], eventIds: new Set() };
        repsMap[e.club].stars.push(r.orgStars);
        repsMap[e.club].eventIds.add(e.id);
      });

      const reps = Object.entries(repsMap).map(([club, data]) => ({
        club,
        avg: data.stars.reduce((s,p)=>s+p, 0) / data.stars.length,
        count: data.stars.length,
        eventsCount: data.eventIds.size
      })).sort((a,b) => b.avg - a.avg);

      const reviewedEvents = state.events.filter(e => state.reviews.some(r => r.eventId === e.id));
      const activeId = state.selectedReviewId || reviewedEvents[0]?.id || null;

      // sync select
      if (activeId && !state.selectedReviewId) {
        state.selectedReviewId = activeId;
      }

      const activeEvent = state.events.find(e => e.id === activeId);
      const activeReviews = state.reviews.filter(r => r.eventId === activeId);

      // Score computations
      let avgOrgStr = "0.0";
      let counts = [0,0,0,0,0];
      const percentages = [0,0,0,0,0];

      if (activeReviews.length > 0) {
        const sum = activeReviews.reduce((s,r) => s + r.orgStars, 0);
        avgOrgStr = (sum / activeReviews.length).toFixed(1);
        counts = [5,4,3,2,1].map(stars => activeReviews.filter(r => r.orgStars === stars).length);
        counts.forEach((c, idx) => {
          percentages[idx] = (c / activeReviews.length) * 100;
        });
      }

      viewport.innerHTML = `
        <div class="space-y-4 pb-4">
          <div class="bg-white/40 dark:bg-slate-900/30 px-4 pt-5 pb-3 border-b border-slate-200/50 dark:border-slate-800/80 sticky top-0 z-20 glass-nav shadow-xs">
            <h1 class="text-xl font-extrabold text-slate-950 dark:text-slate-50">
              📚 Trạm Tri Thức & Review
            </h1>
            <p class="text-[10px] text-slate-400 dark:text-slate-500 font-bold mt-1">Đúc rút tri thức, hội thảo từ các trải nghiệm thật của FTUers.</p>
          </div>

          <!-- Trust shield -->
          <div class="px-4">
            <div class="bg-brand-red-light dark:bg-rose-950/20 border border-brand-red-mid/40 dark:border-rose-900/30 text-[#9b0c22] dark:text-rose-450 rounded-2xl p-3 flex items-center gap-2.5 soft-shadow">
              <i data-lucide="shield-check" class="w-5 h-5 flex-shrink-0 text-brand-red"></i>
              <span class="text-[10px] font-extrabold leading-normal uppercase tracking-wider">Review được kiểm duyệt an toàn, ẩn danh thông tin</span>
            </div>
          </div>

          <!-- Club Reputation ranking list -->
          ${reps.length > 0 ? `
            <div class="px-4 space-y-3">
              <h3 class="text-[9px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest flex items-center gap-1">
                <i data-lucide="award" class="w-3.5 h-3.5 text-brand-red"></i> Uy tín Ban tổ chức (CLB)
              </h3>
              <div class="space-y-2">
                ${reps.slice(0, 3).map((r,idx) => `
                  <div class="bg-white/60 dark:bg-slate-900/40 border border-slate-200/30 dark:border-slate-800 rounded-2xl p-4 flex items-center justify-between soft-shadow">
                    <div class="flex items-center gap-3">
                      <div class="w-8 h-8 rounded-lg bg-brand-red-light text-brand-red dark:bg-slate-800 flex items-center justify-center font-black text-xs border border-brand-red/10">${idx+1}</div>
                      <div>
                        <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100">${r.club}</h4>
                        <p class="text-[9px] text-slate-400 font-bold mt-0.5">${r.eventsCount} hoạt động · ${r.count} đánh giá</p>
                      </div>
                    </div>
                    <div class="text-right">
                      <span class="text-md font-black text-brand-red leading-none block">${r.avg.toFixed(1)}</span>
                      <div class="flex gap-0.5 mt-1 select-none">${renderPureStars(r.avg, "w-2.5 h-2.5")}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Horizontal Select Scroll Event reviewed -->
          ${reviewedEvents.length > 0 ? `
            <div class="space-y-4">
              <div class="px-4">
                <h3 class="text-[9px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 flex items-center gap-1">
                  <i data-lucide="message-square" class="w-3.5 h-3.5 text-brand-red"></i> Đúc rút từ hoạt động
                </h3>
                <div class="flex gap-2 overflow-x-auto scrollbar-none">
                  ${reviewedEvents.map(e => `
                    <button onclick="state.selectedReviewId=${e.id}" class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all border cursor-pointer ${
                      activeId === e.id
                        ? 'bg-brand-red text-white border-brand-red shadow-sm'
                        : 'bg-white/60 dark:bg-slate-900/30 border-slate-200/50 dark:border-slate-800/50 text-slate-400 hover:bg-slate-50'
                    }">${e.emoji} ${e.name.length > 25 ? e.name.substring(0, 23)+'…' : e.name}</button>
                  `).join('')}
                </div>
              </div>

              <!-- Active Event breakdown logs -->
              ${activeEvent ? `
                <div class="px-4 space-y-4">
                  <div class="bg-white/60 dark:bg-slate-900/60 border border-slate-200/30 dark:border-slate-800 rounded-3xl p-5 soft-shadow space-y-4">
                    
                    <div class="flex gap-3 items-center border-b border-slate-100 dark:border-slate-850 pb-3">
                      <div class="w-10 h-10 rounded-xl bg-slate-50 dark:bg-slate-800/50 flex items-center justify-center text-xl select-none">${activeEvent.emoji}</div>
                      <div>
                        <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100 leading-snug">${activeEvent.name}</h4>
                        <p class="text-[9px] text-slate-400 font-bold mt-0.5">💡 do CLB ${activeEvent.club} tổ chức</p>
                      </div>
                    </div>

                    <!-- Scores representation -->
                    <div class="flex gap-6 items-center">
                      <div class="text-center px-1">
                        <span class="text-3xl font-black text-brand-red block leading-none">${avgOrgStr}</span>
                        <div class="flex gap-0.5 mt-2 justify-center">${renderPureStars(parseFloat(avgOrgStr))}</div>
                        <span class="text-[9px] text-slate-400 font-bold mt-1 block">${activeReviews.length} lượt đánh giá</span>
                      </div>
                      
                      <div class="flex-grow space-y-2">
                        ${[5,4,3,2,1].map((s, idx) => `
                          <div class="flex items-center gap-1.5 text-[9px] text-slate-400 font-bold leading-none">
                            <span class="w-2.5">${s}</span>
                            <div class="flex-grow h-1.5 bg-slate-100 dark:bg-slate-800/85 rounded-full overflow-hidden">
                              <div class="h-full bg-brand-red rounded-full" style="width:${percentages[idx]}%" />
                            </div>
                            <span class="w-3">${counts[idx]}</span>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  </div>

                  <!-- Takeaway lists -->
                  <div class="space-y-3 pt-1">
                    <h4 class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Key Takeaways từ sinh viên</h4>
                    ${activeReviews.map(r => `
                      <div class="bg-white/50 dark:bg-slate-900/40 border border-slate-200/30 dark:border-slate-800 rounded-2xl p-4.5 soft-shadow space-y-3">
                        <div class="flex justify-between items-center text-xs">
                          <span class="font-bold text-slate-700 dark:text-slate-200">${r.user}</span>
                          <div class="flex gap-0.5 text-[9px] text-slate-400 leading-none">
                            <span>Tổ chức:</span>
                            ${renderPureStars(r.orgStars, "w-2.5 h-2.5")}
                          </div>
                        </div>

                        <div class="bg-brand-red-light dark:bg-brand-red/10 border-l-4 border-brand-red p-3.5 rounded-r-xl space-y-1">
                          <span class="text-[8px] font-black text-[#9b0c22] dark:text-rose-450 uppercase tracking-wider block">Bài học rút gọn / Trải nghiệm</span>
                          <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed font-semibold italic">${r.takeaway}</p>
                        </div>

                        ${r.tagsPos.length > 0 || r.tagsNeg.length > 0 ? `
                          <div class="flex flex-wrap gap-1">
                            ${r.tagsPos.map(tag => `<span class="text-[8px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-100 px-1.5 py-0.5 rounded">+ ${tag}</span>`).join('')}
                            ${r.tagsNeg.map(tag => `<span class="text-[8px] font-bold bg-rose-50 text-rose-700 border border-rose-100 px-1.5 py-0.5 rounded">- ${tag}</span>`).join('')}
                          </div>
                        `: ''}
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          ` : ''}

          <!-- Write review button -->
          <div class="px-4 pt-1">
            <a href="https://tally.so/r/pbk2xq" target="_blank" class="flex items-center justify-center gap-2 w-full py-4 bg-white/40 border-2 border-dashed border-slate-200 dark:border-slate-800 text-slate-400 hover:text-brand-red hover:border-brand-red-mid rounded-2xl text-xs font-bold transition-all shadow-xs cursor-pointer">
              <i data-lucide="edit-3" class="w-4 h-4"></i> Chia sẻ Key Takeaways của bạn
            </a>
            <p class="text-[9px] text-slate-400 text-center font-bold mt-2">* Thông tin được cập nhật bảo mật sau khi duyệt.</p>
          </div>
        </div>
      `;
    }

    // ── TRANG TIÊU CHUẨN ĐRL ──
    function renderDrl() {
      const tabs = [
        { value: '1.1', label: 'Mục 1.1' },
         { value: '3.1', label: 'Mục 3.1' },
         { value: '3.2', label: 'Mục 3.2' },
         { value: '0', label: 'Không ĐRL' }
      ];

      const filtered = state.events.filter(e => String(e.mucDRL) === String(state.currentDrlMuc))
        .sort((a,b) => {
          const dlA = getDaysLeft(a.deadline);
          const dlB = getDaysLeft(b.deadline);
          if (dlA >= 0 && dlB >= 0) return dlA - dlB;
          if (dlA < 0 && dlB < 0) return dlB - dlA;
          return dlA >= 0 ? -1 : 1;
        });

      viewport.innerHTML = `
        <div class="space-y-4 pb-4">
          <div class="bg-white/40 dark:bg-slate-900/30 px-4 pt-5 pb-3 border-b border-slate-200/50 dark:border-slate-800/80 sticky top-0 z-20 glass-nav shadow-xs">
            <h1 class="text-xl font-extrabold text-slate-950 dark:text-slate-50">
              🎯 Điểm rèn luyện quy đổi
            </h1>
            <p class="text-[10px] text-slate-400 font-bold mt-1">Đánh giá nhanh và quy đổi điểm chuẩn theo Thông tư quy chế FTU.</p>

            <div class="grid grid-cols-4 gap-1.5 mt-4">
              ${tabs.map(t => `
                <button onclick="state.currentDrlMuc='${t.value}'" class="py-3 px-1 rounded-xl text-xs font-bold cursor-pointer transition-all border ${
                  state.currentDrlMuc === t.value
                    ? 'bg-brand-red text-white border-brand-red shadow-sm font-black'
                    : 'bg-white/60 dark:bg-slate-800/50 border-slate-200/60 dark:border-slate-800 text-slate-400'
                }">${t.label}</button>
              `).join('')}
            </div>
          </div>

          <!-- Description DRL card -->
          <div class="px-4">
            <div class="bg-slate-100/50 dark:bg-slate-850 border border-slate-200/30 dark:border-slate-800 p-4 rounded-2xl text-[11px] text-slate-500 font-bold leading-relaxed soft-shadow flex gap-2.5">
              <i data-lucide="award" class="w-5 h-5 text-brand-red flex-shrink-0"></i>
              <span>${DRL_DESCS[state.currentDrlMuc]}</span>
            </div>
          </div>

          <!-- List columns -->
          <div class="px-4 space-y-3">
            ${filtered.length === 0 ? `
              <div class="text-center py-12 bg-white/40 border border-slate-200/40 rounded-2xl p-4 text-slate-400 text-xs">Chưa có hoạt động nào trong mục này.</div>
            ` : filtered.map(e => {
              const dl = getDaysLeft(e.deadline);
              const isU = dl <= 3 && dl >= 0;
              const hasE = dl < 0;
              let deadlineText = hasE ? 'Đã hết hạn' : dl === 0 ? 'Hết đơn hôm nay' : `Còn ${dl} ngày`;
              
              return `
                <div onclick="state.selectedEventId=${e.id}" class="bg-white/60 dark:bg-slate-900/50 border border-slate-200/35 dark:border-slate-800 rounded-2xl p-4 flex justify-between items-center cursor-pointer soft-shadow group">
                  <div class="min-w-0 pr-2 space-y-1">
                    <span class="inline-block text-[8px] font-black uppercase text-[#9b0c22] dark:text-rose-450 bg-brand-red-light px-1.5 py-0.5 rounded border border-brand-red/10">${e.club}</span>
                    <h4 class="text-xs font-extrabold text-slate-800 dark:text-slate-100 leading-snug group-hover:text-brand-red transition-all truncate">${e.emoji} ${e.name}</h4>
                    <div class="text-[9px] text-slate-400 font-bold flex gap-2 items-center flex-wrap">
                      <span>Diễn ra: ${formatVNDate(e.date)}</span>
                      <span>•</span>
                      <span class="${hasE ? 'text-slate-300 dark:text-slate-600' : isU ? 'text-red-600 animate-pulse font-black' : 'text-slate-400'}">Đăng ký: ${deadlineText}</span>
                    </div>
                  </div>

                  <div class="text-right flex-shrink-0">
                    ${e.diemDRL > 0 ? `
                      <span class="text-base font-black text-brand-red">+${e.diemDRL}đ</span>
                    ` : `
                      <span class="text-xs text-slate-400 font-bold">—</span>
                    `}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // Star UI drawer helper
    function renderPureStars(rating, classS = "w-3 h-3") {
      const full = Math.floor(rating);
      const half = rating - full >= 0.4;
      let html = '';
      for (let i = 0; i < 5; i++) {
        if (i < full) {
          html += `<i data-lucide="star" class="${classS} text-amber-400 fill-amber-400"></i>`;
        } else if (i === full && half) {
          html += `<i data-lucide="star-half" class="${classS} text-amber-400 fill-amber-400"></i>`;
        } else {
          html += `<i data-lucide="star" class="${classS} text-slate-200 dark:text-slate-700"></i>`;
        }
      }
      return html;
    }

    // Image error loader handles
    function renderImgBlock(e) {
      if (e.POSTER) {
        return `
          <img src="${e.POSTER}" class="w-full h-full object-cover transition-all group-hover:scale-105" loading="lazy" referrerPolicy="no-referrer" onerror="fallbackPoster(this, '${e.emoji}', '${e.color}', '${e.club}')">
        `;
      }
      return `
        <div class="w-full h-full flex flex-col items-center justify-center p-3 text-center" style="background-color: ${e.color || '#fdf0f2'}">
          <span class="text-4xl select-none animate-bounce-subtle">${e.emoji || '🎓'}</span>
          <span class="text-[9px] font-black text-slate-400 uppercase mt-1 tracking-widest">${e.club}</span>
        </div>
      `;
    }

    window.fallbackPoster = function(img, emoji, color, club) {
      const parent = img.parentElement;
      if (parent) {
        parent.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center p-3 text-center" style="background-color: ${color || '#fdf0f2'}">
            <span class="text-4xl select-none animate-bounce-subtle">${emoji || '🎓'}</span>
            <span class="text-[9px] font-black text-slate-400 uppercase mt-1 tracking-widest">${club}</span>
          </div>
        `;
        lucide.createIcons();
      }
    };

    // ══════════════════════════════════════════
    //   DETAIL SHEET MODAL LOADER
    // ══════════════════════════════════════════
    const overlay = document.getElementById('modal-overlay');
    const sheet = document.getElementById('modal-sheet');

    function renderModal() {
      const id = state.selectedEventId;
      if (!id) {
        closeModal();
        return;
      }

      const e = state.events.find(ev => ev.id === id);
      if (!e) return;

      const activeEReviews = state.reviews.filter(r => r.eventId === e.id);
      const canSub = e.status === 'open';

      const body = document.getElementById('modal-body');
      const footer = document.getElementById('modal-footer');

      body.innerHTML = `
        <div class="h-44 rounded-2xl overflow-hidden shadow border border-slate-100/50 bg-slate-100 dark:bg-slate-800">
          ${renderImgBlock(e)}
        </div>

        <div>
          <div class="flex flex-wrap gap-2 mb-2">
            <span class="text-[9px] font-black px-2 py-0.5 rounded-full border border-rose-100 bg-brand-red-light text-brand-red uppercase">${e.status==='open'?'Đang hoạt động':e.status==='closed'?'Hết hạn':'Đã diễn ra'}</span>
            <span class="bg-slate-100 dark:bg-slate-800 text-slate-400 text-[9px] font-black uppercase px-2 py-0.5 rounded-full">${e.type}</span>
            ${e.mucDRL && e.mucDRL !== '0' ? `<span class="bg-blue-50 text-blue-700 text-[9px] font-bold px-2 py-0.5 rounded-full">ĐRL Mục ${e.mucDRL} (+${e.diemDRL}đ)</span>`:''}
          </div>
          <h2 class="text-base sm:text-lg font-black text-slate-800 dark:text-white leading-snug">
            ${e.emoji} ${e.name}
          </h2>
        </div>

        <!-- Meta grids -->
        <div class="grid grid-cols-2 gap-3.5 bg-slate-100/50 dark:bg-slate-800/30 rounded-2xl p-4 border border-slate-200/30 dark:border-slate-800">
          <div class="space-y-0.5">
            <span class="text-[8px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest block">Thời gian diễn ra</span>
            <span class="text-xs font-bold text-slate-700 dark:text-slate-200 block">${formatVNDate(e.date)}, ${e.time}</span>
          </div>
          <div class="space-y-0.5">
            <span class="text-[8px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest block">Địa điểm</span>
            <span class="text-xs font-bold text-slate-700 dark:text-slate-200 block truncate">${e.location || (e.mode === 'Online'? 'Họp trực tuyến':'TBA')}</span>
          </div>
          <div class="space-y-0.5">
            <span class="text-[8px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest block">Ban tổ chức</span>
            <span class="text-xs font-bold text-slate-700 dark:text-slate-200 block truncate">${e.club}</span>
          </div>
          <div class="space-y-0.5">
            <span class="text-[8px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest block">Hình thức</span>
            <span class="text-xs font-bold text-slate-700 dark:text-slate-200 block">${e.mode}</span>
          </div>
        </div>

        <!-- Desc -->
        ${e.desc ? `
          <div class="space-y-1">
            <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest block">Nội dung chi tiết</span>
            <div class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed bg-slate-100/40 dark:bg-slate-800/50 border border-slate-200/30 dark:border-slate-800 rounded-xl p-3.5 max-h-36 overflow-y-auto whitespace-pre-line">${e.desc}</div>
          </div>
        `:''}

        <!-- Skills -->
        ${e.skills.length > 0 ? `
          <div class="space-y-2">
            <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest block">Kỹ năng cốt lõi</span>
            <div class="flex flex-wrap gap-1.5">
              ${e.skills.map(sk => `<span class="text-xs bg-white dark:bg-slate-850 text-slate-500 dark:text-slate-450 px-2 py-1 rounded-lg border border-slate-200/50 dark:border-slate-800">${sk}</span>`).join('')}
            </div>
          </div>
        `:''}

        <!-- Associated review lists inside modal details -->
        ${activeEReviews.length > 0 ? `
          <div class="space-y-2.5 pt-2">
            <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest block">Review thực từ FTUers</span>
            <div class="space-y-2 max-h-40 overflow-y-auto pr-1">
              ${activeEReviews.slice(0,2).map(r => `
                <div class="bg-slate-50 dark:bg-slate-900 border border-slate-200/45 dark:border-slate-800 p-3.5 rounded-xl space-y-1.5 shadow-xs">
                  <div class="flex justify-between items-center text-[10px] font-bold text-slate-500">
                    <span>${r.user}</span>
                    <div class="flex gap-0.5">${renderPureStars(r.orgStars, "w-2.5 h-2.5")}</div>
                  </div>
                  <p class="text-xs text-slate-600 dark:text-slate-300 italic font-semibold leading-relaxed block">"${r.takeaway}"</p>
                </div>
              `).join('')}
            </div>
          </div>
        `:''}
      `;

      if (canSub && e.link) {
        footer.innerHTML = `
          <a href="${e.link}" target="_blank" class="w-full py-3.5 px-4 bg-brand-red hover:bg-brand-red-dark text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 active:scale-[0.98] transition-transform cursor-pointer shadow">
            Đăng ký tham gia ngay <i data-lucide="external-link" class="w-4 h-4"></i>
          </a>
        `;
      } else {
        footer.innerHTML = `
          <div class="w-full text-center py-3 bg-slate-100 dark:bg-slate-850 border border-slate-200/50 dark:border-slate-800 text-slate-400 font-extrabold rounded-xl text-xs">
            ${e.status==='ended'?'Hoạt động đã kết thúc':'Cổng đăng ký đã đóng'}
          </div>
        `;
      }

      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        sheet.classList.remove('translate-y-full');
      }, 50);

      document.body.classList.add('overflow-hidden');
      lucide.createIcons();
    }

    function closeModal() {
      sheet.classList.add('translate-y-full');
      overlay.classList.add('opacity-0');
      setTimeout(() => {
        overlay.classList.add('hidden');
        state.selectedEventId = null;
      }, 300);
      document.body.classList.remove('overflow-hidden');
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    overlay.addEventListener('click', (ev) => {
      if (ev.target === overlay) closeModal();
    });

    // ══════════════════════════════════════════
    //   BACKGROUND SYNC TOAST PANEL
    // ══════════════════════════════════════════
    const toast = document.getElementById('toast-container');
    
    function toggleToast() {
      if (state.showRefreshToast) {
        toast.classList.remove('hidden');
      } else {
        toast.classList.add('hidden');
      }
    }

    document.getElementById('toast-close').addEventListener('click', () => {
      state.showRefreshToast = false;
    });

    document.getElementById('toast-refresh-btn').addEventListener('click', () => {
      if (state.pendingSyncData) {
        state.events = state.pendingSyncData.events;
        state.reviews = state.pendingSyncData.reviews;
        
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          timestamp: Date.now(),
          events: state.pendingSyncData.events,
          reviews: state.pendingSyncData.reviews
        }));
        
        state.pendingSyncData = null;
      }
      state.showRefreshToast = false;
    });

    // ══════════════════════════════════════════
    //   TAB NAVIGATION CONTROL
    // ══════════════════════════════════════════
    window.syncNavButtons = function(tab) {
      // Sync bottom nav buttons
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const btnTab = btn.getAttribute('data-tab');
        const dot = btn.querySelector('.nav-dot');
        if (btnTab === tab) {
          btn.classList.add('text-brand-red', 'font-bold');
          btn.classList.remove('text-slate-400', 'dark:text-slate-500');
          if (dot) dot.classList.remove('hidden');
        } else {
          btn.classList.remove('text-brand-red', 'font-bold');
          btn.classList.add('text-slate-400', 'dark:text-slate-500');
          if (dot) dot.classList.add('hidden');
        }
      });

      // Sync sidebar buttons
      document.querySelectorAll('.nav-btn-sidebar').forEach(btn => {
        const btnTab = btn.getAttribute('data-tab');
        if (btnTab === tab) {
          btn.classList.add('text-brand-red', 'font-bold', 'bg-brand-red-light', 'dark:bg-brand-red/10', 'dark:text-rose-450');
          btn.classList.remove('text-slate-400', 'dark:text-slate-500', 'hover:bg-slate-100', 'dark:hover:bg-slate-800/40', 'dark:hover:text-slate-350');
        } else {
          btn.classList.remove('text-brand-red', 'font-bold', 'bg-brand-red-light', 'dark:bg-brand-red/10', 'dark:text-rose-450');
          btn.classList.add('text-slate-400', 'dark:text-slate-500', 'hover:bg-slate-100', 'dark:hover:bg-slate-800/40', 'dark:hover:text-slate-350');
        }
      });
    };

    document.querySelectorAll('.nav-btn, .nav-btn-sidebar').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-tab');
        state.activeTab = tab;
      });
    });

    // ══════════════════════════════════════════
    //   APPLET INITIALIZATION
    // ══════════════════════════════════════════
    (async function init() {
      initTheme();
      await loadResources();
      renderApp();
      if (typeof syncNavButtons === 'function') {
        syncNavButtons(state.activeTab);
      }
    })();
  </script>
</body>
</html>
